# Font config
font_family MonoLisa Nerd Font
font_size 14
disable_ligatures cursor
# Stylistic sets: plain ≥ ≤ (ss10), 0xff as 0×ff (ss11), joined .= ..= (ss17).
# One line per style, by PostScript name; the regular style's is plain
# MonoLisaNF (kitty --debug-font-fallback lists them).
font_features MonoLisaNF            +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-Bold       +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-Italic     +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-BoldItalic +ss10 +ss11 +ss17 +ss19 +ss20

# Window config
initial_window_width 900
initial_window_height 480
remember_window_size no

tab_bar_edge bottom
tab_bar_style separator
tab_separator " ▓▓ "
tab_switch_strategy left

# Smooth, responsive drawing. Typed characters are drawn right away anyway:
# kitty skips input_delay when less than 1 KB is waiting and repaint_delay
# while input is pending, so lowering them only costs CPU and lets
# full-screen programs (Neovim) flicker with half-drawn frames.
#   input_delay 3        kitty's default: batches a full-screen redraw
#   repaint_delay 8      up to ~120 frames a second, for ProMotion displays
#   sync_to_monitor yes  draw in step with the display: no tearing, smooth
#                        scrolling
input_delay 3
repaint_delay 8
sync_to_monitor yes

# MacOS Options
macos_option_as_alt yes
macos_titlebar_color #192330
macos_show_window_title_in window

# Misc
undercurl_style thick-sparse
copy_on_select yes
show_hyperlink_targets yes
url_style curly

# Ctrl+backtick sends F12, which toggles Neovim's terminal (snacks.nvim); a
# plain function key also gets through tmux.
map ctrl+grave send_key f12

# Ctrl+Shift+H / Ctrl+Shift+L switch tmux windows (tmux.conf): pass them on
# instead of kitty's own shortcuts (scrollback, next layout)
map ctrl+shift+h no_op
map ctrl+shift+l no_op

# Cmd+C in Neovim copies its selection to the clipboard: while Neovim has
# focus (it sets the user variable in_editor, see nvim/lua/config/keymaps.lua)
# Cmd+C copies kitty's own selection if there is one and sends F20, which
# Neovim maps to "+y. Everywhere else Cmd+C is kitty's normal copy.
# F20 is sent as its classic code (ESC[34~): inside tmux, send_key would use
# kitty's own keyboard protocol (ESC[57383u), which Neovim doesn't read as F20.
map --when-focus-on var:in_editor cmd+c combine : copy_to_clipboard : send_text all \x1b[34~

# Bell
visual_bell_duration .1

# Theme
include nightfox.conf
