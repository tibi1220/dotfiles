# Font config
font_family MonoLisa Nerd Font
font_size 14
disable_ligatures cursor
# Stylistic sets: plain ≥ ≤ (ss10), 0xff as 0×ff (ss11), joined .= ..= (ss17).
# One line per style, by PostScript name; the regular style's is plain
# MonoLisaNF (kitty --debug-font-fallback lists them).
font_features MonoLisaNF            +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-Bold       +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-Italic     +ss10 +ss11 +ss17 +ss19 +ss20
font_features MonoLisaNF-BoldItalic +ss10 +ss11 +ss17 +ss19 +ss20

# Window config
initial_window_width 900
initial_window_height 480
remember_window_size no

tab_bar_edge bottom
tab_bar_style separator
tab_separator " ▓▓ "
tab_switch_strategy left

# Snappier input
input_delay 0
repaint_delay 2
sync_to_monitor no

# MacOS Options
macos_option_as_alt yes
macos_titlebar_color #192330
macos_show_window_title_in window

# Misc
undercurl_style thick-sparse
copy_on_select yes
show_hyperlink_targets yes
url_style curly

# Ctrl+backtick sends F12, which toggles Neovim's terminal (snacks.nvim); a
# plain function key also gets through tmux.
map ctrl+grave send_key f12

# Ctrl+Shift+H / Ctrl+Shift+L switch tmux windows (tmux.conf): pass them on
# instead of kitty's own shortcuts (scrollback, next layout)
map ctrl+shift+h no_op
map ctrl+shift+l no_op

# Bell
visual_bell_duration .1

# Theme
include nightfox.conf
