# General settings
set -g mouse on
set -g history-limit 50000
set -g focus-events on

# Remove hooks used by the previous dynamic status-bar setup. Keeping this
# cleanup here also prevents resurrected sessions from restoring stale hooks.
set-hook -gu after-select-pane
set-hook -gu after-select-window
set-hook -gu after-split-window
set-hook -gu after-kill-pane
set-hook -gu session-window-changed
set-hook -gpu pane-focus-in
set-hook -gpu pane-exited

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize tpack
run 'tpack init'

# Colorscheme
source-file ~/.config/tmux/themes/nightfox.tmux
